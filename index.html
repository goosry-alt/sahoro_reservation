<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>예약 관리 시스템</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        /* 추가적인 커스텀 스타일 필요 시 작성 */
        .modal-active { overflow: hidden; }
    </style>
</head>
<body class="bg-slate-100 text-slate-800 font-sans min-h-screen">

    <!-- 상단 헤더 -->
    <header class="bg-indigo-600 text-white shadow-md p-4 mb-6">
        <div class="max-w-7xl mx-auto flex justify-between items-center">
            <h1 class="text-2xl font-bold">예약 관리 시스템</h1>
            <button onclick="openModal(-1)" class="bg-emerald-500 hover:bg-emerald-600 text-white font-semibold px-4 py-2 rounded-lg transition shadow">
                + 신규 예약 등록
            </button>
        </div>
    </header>

    <main class="max-w-7xl mx-auto px-4">
        <!-- 대시보드 요약 카드 -->
        <div class="grid grid-cols-1 md:grid-cols-4 gap-4 mb-6">
            <div class="bg-white p-4 rounded-xl shadow border border-slate-200 text-center">
                <span class="text-slate-500 text-sm">전체 예약</span>
                <div id="statTotal" class="text-2xl font-bold text-indigo-600">0건</div>
            </div>
            <div class="bg-white p-4 rounded-xl shadow border border-slate-200 text-center">
                <span class="text-slate-500 text-sm">확정 예약</span>
                <div id="statActive" class="text-2xl font-bold text-emerald-600">0건</div>
            </div>
            <div class="bg-white p-4 rounded-xl shadow border border-slate-200 text-center">
                <span class="text-slate-500 text-sm">취소 예약</span>
                <div id="statCancelled" class="text-2xl font-bold text-rose-600">0건</div>
            </div>
            <div class="bg-white p-4 rounded-xl shadow border border-slate-200 text-center">
                <span class="text-slate-500 text-sm">총 인원</span>
                <div id="statPax" class="text-2xl font-bold text-amber-600">0명</div>
            </div>
        </div>

        <!-- 필터 및 검색 -->
        <div class="bg-white p-4 rounded-xl shadow border border-slate-200 mb-6 flex flex-wrap gap-4 items-center justify-between">
            <div class="flex flex-wrap gap-2 items-center">
                <input type="text" id="searchInput" onkeyup="renderTable()" placeholder="예약자명, 상태 검색..." class="border border-slate-300 rounded-lg px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-indigo-500">
                <select id="statusFilter" onchange="renderTable()" class="border border-slate-300 rounded-lg px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-indigo-500">
                    <option value="ALL">전체 상태</option>
                    <option value="ACTIVE">확정 (ACTIVE)</option>
                    <option value="CANCELLED">취소 (CANCELLED)</option>
                </select>
            </div>
            <button onclick="fetchData()" class="bg-slate-600 hover:bg-slate-700 text-white text-sm px-4 py-2 rounded-lg transition">
                🔄 새로고침
            </button>
        </div>

        <!-- 예약 리스트 테이블 -->
        <div class="bg-white rounded-xl shadow border border-slate-200 overflow-x-auto">
            <table class="w-full text-left border-collapse text-sm">
                <thead>
                    <tr class="bg-slate-50 border-b border-slate-200 text-slate-600">
                        <th class="p-3">상태</th>
                        <th class="p-3">예약자명</th>
                        <th class="p-3">체크인</th>
                        <th class="p-3">체크아웃</th>
                        <th class="p-3">박수</th>
                        <th class="p-3">인원</th>
                        <th class="p-3">객실수</th>
                        <th class="p-3">동행자명단</th>
                        <th class="p-3 text-center">관리</th>
                    </tr>
                </thead>
                <tbody id="reservationTableBody">
                    <tr>
                        <td colspan="9" class="p-6 text-center text-slate-400">데이터를 불러오는 중입니다...</td>
                    </tr>
                </tbody>
            </table>
        </div>
    </main>

    <!-- 입력 / 수정 모달 -->
    <div id="resModal" class="fixed inset-0 bg-slate-900 bg-opacity-50 hidden items-center justify-center p-4 z-50">
        <div class="bg-white rounded-2xl shadow-xl w-full max-w-4xl max-h-[90vh] overflow-y-auto p-6">
            <div class="flex justify-between items-center mb-4 border-b pb-2">
                <h2 id="modalTitle" class="text-xl font-bold text-slate-800">신규 예약 등록</h2>
                <button onclick="closeModal()" class="text-slate-400 hover:text-slate-600 text-2xl font-bold">&times;</button>
            </div>

            <form id="resForm" onsubmit="handleFormSubmit(event)" class="space-y-4">
                <input type="hidden" id="editIndex" value="-1">

                <div class="grid grid-cols-1 md:grid-cols-3 gap-4">
                    <div>
                        <label class="block text-xs font-semibold text-slate-600 mb-1">상태</label>
                        <select id="formStatus" class="w-full border rounded-lg p-2 text-sm">
                            <option value="ACTIVE">확정 (ACTIVE)</option>
                            <option value="CANCELLED">취소 (CANCELLED)</option>
                        </select>
                    </div>
                    <div>
                        <label class="block text-xs font-semibold text-slate-600 mb-1">예약자명 *</label>
                        <input type="text" id="formName" required class="w-full border rounded-lg p-2 text-sm">
                    </div>
                    <div>
                        <label class="block text-xs font-semibold text-slate-600 mb-1">체크인 *</label>
                        <input type="date" id="formCheckIn" required onchange="calcNights()" class="w-full border rounded-lg p-2 text-sm">
                    </div>
                    <div>
                        <label class="block text-xs font-semibold text-slate-600 mb-1">체크아웃 *</label>
                        <input type="date" id="formCheckOut" required onchange="calcNights()" class="w-full border rounded-lg p-2 text-sm">
                    </div>
                    <div>
                        <label class="block text-xs font-semibold text-slate-600 mb-1">박수</label>
                        <input type="number" id="formNights" readonly class="w-full border rounded-lg p-2 text-sm bg-slate-100">
                    </div>
                    <div>
                        <label class="block text-xs font-semibold text-slate-600 mb-1">인원수</label>
                        <input type="number" id="formPax" min="1" value="1" class="w-full border rounded-lg p-2 text-sm">
                    </div>
                    <div>
                        <label class="block text-xs font-semibold text-slate-600 mb-1">객실수</label>
                        <input type="number" id="formRoom" min="1" value="1" class="w-full border rounded-lg p-2 text-sm">
                    </div>
                    <div>
                        <label class="block text-xs font-semibold text-slate-600 mb-1">리프트권</label>
                        <input type="text" id="formLift" class="w-full border rounded-lg p-2 text-sm">
                    </div>
                    <div>
                        <label class="block text-xs font-semibold text-slate-600 mb-1">버스 (In)</label>
                        <input type="text" id="formBusIn" class="w-full border rounded-lg p-2 text-sm">
                    </div>
                    <div>
                        <label class="block text-xs font-semibold text-slate-600 mb-1">버스 (Out)</label>
                        <input type="text" id="formBusOut" class="w-full border rounded-lg p-2 text-sm">
                    </div>
                    <div>
                        <label class="block text-xs font-semibold text-slate-600 mb-1">항공 (In)</label>
                        <input type="text" id="formFlightIn" class="w-full border rounded-lg p-2 text-sm">
                    </div>
                    <div>
                        <label class="block text-xs font-semibold text-slate-600 mb-1">항공 (Out)</label>
                        <input type="text" id="formFlightOut" class="w-full border rounded-lg p-2 text-sm">
                    </div>
                </div>

                <div>
                    <label class="block text-xs font-semibold text-slate-600 mb-1">객실 배정</label>
                    <input type="text" id="formRoomAllocation" class="w-full border rounded-lg p-2 text-sm">
                </div>

                <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                    <div>
                        <label class="block text-xs font-semibold text-slate-600 mb-1">메모</label>
                        <textarea id="formMemo" rows="2" class="w-full border rounded-lg p-2 text-sm"></textarea>
                    </div>
                    <div>
                        <label class="block text-xs font-semibold text-slate-600 mb-1">호텔 메모</label>
                        <textarea id="formHotelMemo" rows="2" class="w-full border rounded-lg p-2 text-sm"></textarea>
                    </div>
                </div>

                <!-- 동행자 목록 등록 섹션 -->
                <div class="border-t pt-4">
                    <div class="flex justify-between items-center mb-2">
                        <h3 class="text-sm font-bold text-slate-700">동행자 명단</h3>
                        <button type="button" onclick="addCompanionRow()" class="bg-indigo-100 hover:bg-indigo-200 text-indigo-700 text-xs px-3 py-1 rounded font-semibold">
                            + 동행자 추가
                        </button>
                    </div>
                    <div class="overflow-x-auto">
                        <table class="w-full text-xs text-left">
                            <thead class="bg-slate-100 border-b">
                                <tr>
                                    <th class="p-1">이름</th>
                                    <th class="p-1">성별</th>
                                    <th class="p-1">생년월일</th>
                                    <th class="p-1">여권번호</th>
                                    <th class="p-1">만료일</th>
                                    <th class="p-1 text-center">소아여부</th>
                                    <th class="p-1 text-center">삭제</th>
                                </tr>
                            </thead>
                            <tbody id="companionTableBody">
                                <!-- 동적으로 행 추가됨 -->
                            </tbody>
                        </table>
                    </div>
                </div>

                <div class="flex justify-end gap-2 border-t pt-4">
                    <button type="button" onclick="closeModal()" class="px-4 py-2 border rounded-lg text-sm hover:bg-slate-50">취소</button>
                    <button type="submit" class="px-4 py-2 bg-indigo-600 text-white rounded-lg text-sm hover:bg-indigo-700 font-semibold">저장</button>
                </div>
            </form>
        </div>
    </div>

    <!-- JavaScript 로직 -->
    <script>
        // Google Apps Script 웹앱 URL (사용자의 배포 URL을 지정하세요)
        const GAS_URL = 'YOUR_GOOGLE_APPS_SCRIPT_WEB_APP_URL';
        
        let reservations = [];

        // 데이터 초기화 및 수신
        async function fetchData() {
            if (!GAS_URL || GAS_URL === 'YOUR_GOOGLE_APPS_SCRIPT_WEB_APP_URL') {
                console.warn('GAS_URL이 설정되지 않았습니다. 테스트용 임시 데이터를 표시합니다.');
                reservations = [
                    {
                        status: 'ACTIVE',
                        name: '홍길동',
                        checkIn: '2026-10-10',
                        checkOut: '2026-10-12',
                        nights: 2,
                        pax: 2,
                        room: 1,
                        lift: '성인2매',
                        busIn: '버스A',
                        busOut: '버스B',
                        flightIn: 'KE123',
                        flightOut: 'KE124',
                        roomAllocation: '101호',
                        memo: '체크인 지연 예상',
                        hotelMemo: '조식 포함',
                        companions: [
                            { name: '김철수', gender: '남', birth: '1990-01-01', passport: 'M12345678', expiry: '2030-01-01', isChild: false }
                        ]
                    }
                ];
                renderTable();
                updateStats();
                return;
            }

            try {
                const res = await fetch(GAS_URL);
                const data = await res.json();
                reservations = data;
                renderTable();
                updateStats();
            } catch (err) {
                console.error('데이터 불러오기 실패:', err);
                alert('데이터를 가져오는 중 오류가 발생했습니다.');
            }
        }

        // 대시보드 통계 업데이트
        function updateStats() {
            document.getElementById('statTotal').innerText = reservations.length + '건';
            const activeCount = reservations.filter(r => r.status === 'ACTIVE').length;
            const cancelCount = reservations.filter(r => r.status === 'CANCELLED').length;
            const totalPax = reservations.reduce((acc, r) => acc + (Number(r.pax) || 0), 0);

            document.getElementById('statActive').innerText = activeCount + '건';
            document.getElementById('statCancelled').innerText = cancelCount + '건';
            document.getElementById('statPax').innerText = totalPax + '명';
        }

        // 리스트 테이블 렌더링
        function renderTable() {
            const tbody = document.getElementById('reservationTableBody');
            const searchKeyword = document.getElementById('searchInput').value.toLowerCase();
            const statusFilter = document.getElementById('statusFilter').value;

            tbody.innerHTML = '';

            const filteredData = reservations.filter(r => {
                const matchesKeyword = (r.name && r.name.toLowerCase().includes(searchKeyword)) ||
                                       (r.status && r.status.toLowerCase().includes(searchKeyword));
                const matchesStatus = statusFilter === 'ALL' || r.status === statusFilter;
                return matchesKeyword && matchesStatus;
            });

            if (filteredData.length === 0) {
                tbody.innerHTML = `<tr><td colspan="9" class="p-6 text-center text-slate-400">검색 조건에 해당되는 데이터가 없습니다.</td></tr>`;
                return;
            }

            filteredData.forEach((item, index) => {
                const tr = document.createElement('tr');
                tr.className = "border-b border-slate-100 hover:bg-slate-50";

                const statusBadge = item.status === 'CANCELLED' 
                    ? `<span class="bg-rose-100 text-rose-700 font-semibold px-2 py-1 rounded text-xs">취소</span>`
                    : `<span class="bg-emerald-100 text-emerald-700 font-semibold px-2 py-1 rounded text-xs">확정</span>`;

                tr.innerHTML = `
                    <td class="p-3">${statusBadge}</td>
                    <td class="p-3 font-semibold text-slate-800">${item.name || '-'}</td>
                    <td class="p-3">${item.checkIn || '-'}</td>
                    <td class="p-3">${item.checkOut || '-'}</td>
                    <td class="p-3">${item.nights || 0}박</td>
                    <td class="p-3">${item.pax || 0}명</td>
                    <td class="p-3">${item.room || 0}실</td>
                    <td class="p-3">
                        <button onclick="openDetailWindow(${index})" class="bg-indigo-50 hover:bg-indigo-100 text-indigo-600 border border-indigo-200 text-xs px-2 py-1 rounded">
                            명단 보기 (${item.companions ? item.companions.length : 0})
                        </button>
                    </td>
                    <td class="p-3 text-center space-x-1">
                        <button onclick="openModal(${index})" class="bg-amber-500 hover:bg-amber-600 text-white text-xs px-2 py-1 rounded">수정</button>
                        <button onclick="deleteReservation(${index})" class="bg-rose-500 hover:bg-rose-600 text-white text-xs px-2 py-1 rounded">삭제</button>
                    </td>
                `;
                tbody.appendChild(tr);
            });
        }

        // 박수 자동 계산
        function calcNights() {
            const checkInVal = document.getElementById('formCheckIn').value;
            const checkOutVal = document.getElementById('formCheckOut').value;

            if (checkInVal && checkOutVal) {
                const checkIn = new Date(checkInVal);
                const checkOut = new Date(checkOutVal);
                if (checkOut > checkIn) {
                    const diffDays = Math.ceil((checkOut - checkIn) / (1000 * 60 * 60 * 24));
                    document.getElementById('formNights').value = diffDays;
                    return;
                }
            }
            document.getElementById('formNights').value = 0;
        }

        // 동행자 행 추가
        function addCompanionRow(data = {}) {
            const tbody = document.getElementById('companionTableBody');
            const tr = document.createElement('tr');
            tr.className = 'border-b';
            tr.innerHTML = `
                <td class="p-1"><input type="text" class="comp-name w-full p-1 border rounded" value="${data.name || ''}" placeholder="이름"></td>
                <td class="p-1">
                    <select class="comp-gender p-1 border rounded">
                        <option value="남" ${data.gender === '남' ? 'selected' : ''}>남</option>
                        <option value="여" ${data.gender === '여' ? 'selected' : ''}>여</option>
                    </select>
                </td>
                <td class="p-1"><input type="date" class="comp-birth p-1 border rounded" value="${data.birth || ''}"></td>
                <td class="p-1"><input type="text" class="comp-passport w-full p-1 border rounded" value="${data.passport || ''}"></td>
                <td class="p-1"><input type="date" class="comp-expiry p-1 border rounded" value="${data.expiry || ''}"></td>
                <td class="p-1 text-center"><input type="checkbox" class="comp-child" ${data.isChild ? 'checked' : ''}></td>
                <td class="p-1 text-center"><button type="button" onclick="this.closest('tr').remove()" class="text-rose-600 font-bold px-2 py-1">X</button></td>
            `;
            tbody.appendChild(tr);
        }

        // 모달 열기 및 초기화
        function openModal(index = -1) {
            const modal = document.getElementById('resModal');
            const form = document.getElementById('resForm');
            form.reset();
            document.getElementById('companionTableBody').innerHTML = '';
            document.getElementById('editIndex').value = index;

            if (index >= 0) {
                const item = reservations[index];
                document.getElementById('modalTitle').innerText = '예약 정보 수정';
                document.getElementById('formStatus').value = item.status || 'ACTIVE';
                document.getElementById('formName').value = item.name || '';
                document.getElementById('formCheckIn').value = item.checkIn || '';
                document.getElementById('formCheckOut').value = item.checkOut || '';
                document.getElementById('formPax').value = item.pax || 1;
                document.getElementById('formRoom').value = item.room || 1;
                document.getElementById('formLift').value = item.lift || '';
                document.getElementById('formBusIn').value = item.busIn || '';
                document.getElementById('formBusOut').value = item.busOut || '';
                document.getElementById('formFlightIn').value = item.flightIn || '';
                document.getElementById('formFlightOut').value = item.flightOut || '';
                document.getElementById('formRoomAllocation').value = item.roomAllocation || '';
                document.getElementById('formMemo').value = item.memo || '';
                document.getElementById('formHotelMemo').value = item.hotelMemo || '';
                
                calcNights();

                if (item.companions && item.companions.length > 0) {
                    item.companions.forEach(c => addCompanionRow(c));
                }
            } else {
                document.getElementById('modalTitle').innerText = '신규 예약 등록';
            }

            modal.classList.remove('hidden');
            modal.classList.add('flex');
        }

        // 모달 닫기
        function closeModal() {
            const modal = document.getElementById('resModal');
            modal.classList.add('hidden');
            modal.classList.remove('flex');
        }

        // 폼 제출 처리 (등록 / 수정)
        async function handleFormSubmit(e) {
            e.preventDefault();

            // 동행자 수집
            const compRows = document.querySelectorAll('#companionTableBody tr');
            const companions = Array.from(compRows).map(tr => ({
                name: tr.querySelector('.comp-name').value,
                gender: tr.querySelector('.comp-gender').value,
                birth: tr.querySelector('.comp-birth').value,
                passport: tr.querySelector('.comp-passport').value,
                expiry: tr.querySelector('.comp-expiry').value,
                isChild: tr.querySelector('.comp-child').checked
            }));

            const formData = {
                status: document.getElementById('formStatus').value,
                name: document.getElementById('formName').value,
                checkIn: document.getElementById('formCheckIn').value,
                checkOut: document.getElementById('formCheckOut').value,
                nights: Number(document.getElementById('formNights').value) || 0,
                pax: Number(document.getElementById('formPax').value) || 1,
                room: Number(document.getElementById('formRoom').value) || 1,
                lift: document.getElementById('formLift').value,
                busIn: document.getElementById('formBusIn').value,
                busOut: document.getElementById('formBusOut').value,
                flightIn: document.getElementById('formFlightIn').value,
                flightOut: document.getElementById('formFlightOut').value,
                roomAllocation: document.getElementById('formRoomAllocation').value,
                memo: document.getElementById('formMemo').value,
                hotelMemo: document.getElementById('formHotelMemo').value,
                companions: companions
            };

            const editIndex = Number(document.getElementById('editIndex').value);

            if (editIndex >= 0) {
                reservations[editIndex] = formData;
            } else {
                reservations.push(formData);
            }

            // 서버 저장 시도 (GAS 사용 시)
            if (GAS_URL && GAS_URL !== 'YOUR_GOOGLE_APPS_SCRIPT_WEB_APP_URL') {
                try {
                    await fetch(GAS_URL, {
                        method: 'POST',
                        body: JSON.stringify(reservations)
                    });
                } catch (err) {
                    console.error('저장 중 오류 발생:', err);
                }
            }

            closeModal();
            renderTable();
            updateStats();
        }

        // 예약 삭제
        async function deleteReservation(index) {
            if (confirm('해당 예약을 삭제하시겠습니까?')) {
                reservations.splice(index, 1);

                if (GAS_URL && GAS_URL !== 'YOUR_GOOGLE_APPS_SCRIPT_WEB_APP_URL') {
                    try {
                        await fetch(GAS_URL, {
                            method: 'POST',
                            body: JSON.stringify(reservations)
                        });
                    } catch (err) {
                        console.error('삭제 저장을 실패했습니다:', err);
                    }
                }

                renderTable();
                updateStats();
            }
        }

        // 동행자 상세 팝업 창 생성 (CSV 다운로드 기능 포함)
        function openDetailWindow(index) {
            const item = reservations[index];
            if (!item) return;

            const detailWin = window.open("", "_blank", "width=800,height=600,scrollbars=yes");
            const companions = item.companions || [];

            let companionRows = companions.map((c, i) => `
                <tr>
                    <td style="border: 1px solid #ddd; padding: 8px; text-align: center;">${i + 1}</td>
                    <td style="border: 1px solid #ddd; padding: 8px;">${c.name || '-'}</td>
                    <td style="border: 1px solid #ddd; padding: 8px; text-align: center;">${c.gender || '-'}</td>
                    <td style="border: 1px solid #ddd; padding: 8px; text-align: center;">${c.birth || '-'}</td>
                    <td style="border: 1px solid #ddd; padding: 8px; text-align: center;">${c.passport || '-'}</td>
                    <td style="border: 1px solid #ddd; padding: 8px; text-align: center;">${c.expiry || '-'}</td>
                    <td style="border: 1px solid #ddd; padding: 8px; text-align: center;">${c.isChild ? '소아' : '성인'}</td>
                </tr>
            `).join('');

            if (companions.length === 0) {
                companionRows = `<tr><td colspan="7" style="border: 1px solid #ddd; padding: 12px; text-align: center; color: #888;">등록된 동행자가 없습니다.</td></tr>`;
            }

            const popupHtml = `
            <!DOCTYPE html>
            <html lang="ko">
            <head>
                <meta charset="UTF-8">
                <title>${item.name || '예약자'} 동행자 명단</title>
                <style>
                    body { font-family: sans-serif; padding: 20px; color: #333; line-height: 1.5; }
                    h2 { border-bottom: 2px solid #4f46e5; padding-bottom: 8px; color: #4f46e5; }
                    .info-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; background: #f8fafc; padding: 12px; border-radius: 8px; margin-bottom: 20px; font-size: 14px; }
                    table { width: 100%; border-collapse: collapse; font-size: 13px; margin-bottom: 20px; }
                    th { background: #f1f5f9; border: 1px solid #ddd; padding: 8px; }
                    .btn-csv { background: #10b981; color: white; border: none; padding: 8px 16px; border-radius: 6px; cursor: pointer; font-weight: bold; }
                    .btn-csv:hover { background: #059669; }
                </style>
            </head>
            <body>
                <h2>예약 정보 및 동행자 명단</h2>
                <div class="info-grid">
                    <div><strong>예약자:</strong> ${item.name || '-'}</div>
                    <div><strong>상태:</strong> ${item.status || '-'}</div>
                    <div><strong>체크인/아웃:</strong> ${item.checkIn || '-'} ~ ${item.checkOut || '-'} (${item.nights || 0}박)</div>
                    <div><strong>총 인원/객실수:</strong> ${item.pax || 0}명 / ${item.room || 0}실</div>
                </div>

                <h3>동행자 목록</h3>
                <table>
                    <thead>
                        <tr>
                            <th>No</th>
                            <th>이름</th>
                            <th>성별</th>
                            <th>생년월일</th>
                            <th>여권번호</th>
                            <th>만료일</th>
                            <th>구분</th>
                        </tr>
                    </thead>
                    <tbody>
                        ${companionRows}
                    </tbody>
                </table>

                <button class="btn-csv" onclick="downloadCSV()">CSV 명단 다운로드</button>

                <script>
                    function downloadCSV() {
                        const companions = ${JSON.stringify(companions)};
                        if (companions.length === 0) {
                            alert("다운로드할 동행자 정보가 없습니다.");
                            return;
                        }
                        
                        let csvContent = "\\uFEFF이름,성별,생년월일,여권번호,만료일,소아여부\\n";
                        companions.forEach(c => {
                            csvContent += \`"\${c.name || ''}","\${c.gender || ''}","\${c.birth || ''}","\${c.passport || ''}","\${c.expiry || ''}","\${c.isChild ? '소아' : '성인'}"\\n\`;
                        });

                        const blob = new Blob([csvContent], { type: 'text/csv;charset=utf-8;' });
                        const url = URL.createObjectURL(blob);
                        const link = document.createElement("a");
                        link.setAttribute("href", url);
                        link.setAttribute("download", "${item.name || '예약자'}_동행자명단.csv");
                        document.body.appendChild(link);
                        link.click();
                        document.body.removeChild(link);
                    }
                <\/script>
            </body>
            </html>
            `;

            detailWin.document.open();
            detailWin.document.write(popupHtml);
            detailWin.document.close();
        }

        // 페이지 로드 시 초기 데이터 로딩
        document.addEventListener('DOMContentLoaded', fetchData);
    </script>
</body>
</html>
