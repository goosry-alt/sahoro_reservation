<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>사호로리조트 예약현황 관리 시스템</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style>
    body { font-family: 'Noto Sans KR', sans-serif; }
    
    .table-container {
      max-height: 600px;
      overflow: auto;
      position: relative;
    }
    .table-container table {
      border-separate: 0;
      width: 100%;
    }
    
    .table-container thead th {
      position: sticky;
      top: 0;
      z-index: 20;
      background-color: #334155 !important;
      color: #ffffff;
      box-shadow: inset 0 -1px 0 #475569;
    }
    
    .sticky-col-1 { position: sticky; left: 0; z-index: 10; background-color: #ffffff; }
    .sticky-col-2 { position: sticky; left: 70px; z-index: 10; background-color: #ffffff; }
    .sticky-col-3 { position: sticky; left: 180px; z-index: 10; background-color: #ffffff; }
    
    thead th.sticky-col-1,
    thead th.sticky-col-2,
    thead th.sticky-col-3 {
      z-index: 30 !important;
      background-color: #334155 !important;
    }
  </style>
</head>
<body class="bg-gray-100 min-h-screen text-gray-800">

  <!-- Header & Nav -->
  <header class="bg-slate-800 text-white shadow-md">
    <div class="max-w-7xl mx-auto px-4 py-4 flex flex-wrap justify-between items-center gap-4">
      <h1 class="text-xl font-bold flex items-center gap-2">
        <i class="fa-solid fa-hotel"></i> 사호로리조트 예약현황 관리
      </h1>
      
      <div class="flex items-center gap-2 flex-grow max-w-xl">
        <input type="text" id="scriptUrl" placeholder="Google Apps Script URL을 입력하세요" 
               class="w-full px-3 py-1.5 text-sm text-gray-900 rounded border border-gray-300 focus:outline-none focus:ring-2 focus:ring-blue-500">
        <button onclick="saveApiUrl()" class="bg-blue-600 hover:bg-blue-700 text-white text-sm px-3 py-1.5 rounded whitespace-nowrap font-medium transition">
          URL 저장
        </button>
      </div>

      <div class="flex items-center gap-2">
        <button onclick="loadData()" class="bg-emerald-600 hover:bg-emerald-700 text-white text-sm px-3 py-1.5 rounded font-medium transition flex items-center gap-1">
          <i class="fa-solid fa-rotate"></i> 불러오기
        </button>
        <button onclick="openModal(-1)" class="bg-amber-600 hover:bg-amber-700 text-white text-sm px-3 py-1.5 rounded font-medium transition flex items-center gap-1">
          <i class="fa-solid fa-plus"></i> 신규 예약
        </button>
      </div>
    </div>
  </header>

  <!-- Main Content -->
  <main class="max-w-7xl mx-auto px-4 py-6 space-y-6">

    <!-- 1. 동일 날짜 & 버스 이용 인원 자동 집계 현황 -->
    <div class="bg-white rounded-lg shadow p-4 border border-gray-200">
      <div class="flex items-center justify-between mb-2">
        <h3 class="text-xs font-bold text-slate-700 uppercase flex items-center gap-1.5">
          <i class="fa-solid fa-bus text-blue-600"></i> 동일 날짜/버스별 탑승 인원 현황
        </h3>
        <span class="text-[11px] text-gray-400">* 카드 클릭 시 버스별 예약자 명단을 확인할 수 있습니다.</span>
      </div>
      
      <div class="max-h-36 overflow-y-auto pr-1 border rounded bg-gray-50">
        <div id="busSummaryList" class="p-2 grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 lg:grid-cols-4 gap-2 text-xs">
          <div class="col-span-full text-center text-gray-400 py-3">데이터를 불러오면 집계 정보가 표시됩니다.</div>
        </div>
      </div>
    </div>

    <!-- 2. 상태별 요약 카운터 -->
    <div class="grid grid-cols-2 sm:grid-cols-3 md:grid-cols-5 gap-3">
      <div class="bg-white p-3 rounded-lg shadow border-l-4 border-sky-500">
        <div class="text-gray-500 text-[11px] font-bold">신규 (NEW)</div>
        <div id="newCount" class="text-xl font-bold mt-0.5 text-sky-600">0건</div>
      </div>
      <div class="bg-white p-3 rounded-lg shadow border-l-4 border-emerald-500">
        <div class="text-gray-500 text-[11px] font-bold">확정 (ACTIVE)</div>
        <div id="activeCount" class="text-xl font-bold mt-0.5 text-emerald-600">0건</div>
      </div>
      <div class="bg-white p-3 rounded-lg shadow border-l-4 border-indigo-500">
        <div class="text-gray-500 text-[11px] font-bold">수정 (UPDATED)</div>
        <div id="updatedCount" class="text-xl font-bold mt-0.5 text-indigo-600">0건</div>
      </div>
      <div class="bg-white p-3 rounded-lg shadow border-l-4 border-amber-500">
        <div class="text-gray-500 text-[11px] font-bold">대기 (WAITING)</div>
        <div id="waitingCount" class="text-xl font-bold mt-0.5 text-amber-600">0건</div>
      </div>
      <div class="bg-white p-3 rounded-lg shadow border-l-4 border-rose-500">
        <div class="text-gray-500 text-[11px] font-bold">취소 (CANCELLED)</div>
        <div id="cancelledCount" class="text-xl font-bold mt-0.5 text-rose-600">0건</div>
      </div>
    </div>

    <!-- 3. 예약 현황 테이블 -->
    <div class="bg-white rounded-lg shadow overflow-hidden border border-gray-200">
      <div class="table-container">
        <table class="w-full text-xs text-left text-gray-600 border-collapse">
          <thead class="bg-slate-700 text-white uppercase text-[11px] tracking-wider">
            <tr>
              <th class="p-2.5 text-center sticky-col-1 w-[70px]">상태</th>
              <th class="p-2.5 sticky-col-2 w-[110px]">체크인/아웃</th>
              <th class="p-2.5 sticky-col-3 w-[100px]">예약자명</th>
              <th class="p-2.5 text-center min-w-[80px]">인원/객실</th>
              <th class="p-2.5 min-w-[180px]">송영버스(IN/OUT)</th>
              <th class="p-2.5 min-w-[180px]">항공편(IN/OUT)</th>
              <th class="p-2.5 min-w-[90px]">방배정</th>
              <th class="p-2.5 min-w-[120px]">고객 메모</th>
              <th class="p-2.5 min-w-[120px]">호텔 메모</th>
              <th class="p-2.5 text-center min-w-[90px]">관리</th>
            </tr>
          </thead>
          <tbody id="reservationTableBody" class="divide-y divide-gray-200">
            <tr>
              <td colspan="10" class="p-8 text-center text-gray-400">
                데이터가 없습니다. [불러오기] 버튼을 클릭하세요.
              </td>
            </tr>
          </tbody>
        </table>
      </div>
    </div>
  </main>

  <!-- 버스 탑승자 목록 모달 팝업 -->
  <div id="busPassengerModal" class="fixed inset-0 bg-black/50 hidden items-center justify-center p-4 z-50">
    <div class="bg-white rounded-xl shadow-2xl w-full max-w-md overflow-hidden">
      <div class="bg-slate-800 text-white px-5 py-3 flex justify-between items-center">
        <h3 id="busModalTitle" class="text-sm font-bold flex items-center gap-2">
          <i class="fa-solid fa-bus text-blue-400"></i> 버스 탑승 명단
        </h3>
        <button onclick="closeBusModal()" class="text-gray-400 hover:text-white"><i class="fa-solid fa-xmark text-lg"></i></button>
      </div>
      <div class="p-4 space-y-3">
        <div id="busModalSubTitle" class="text-xs text-slate-500 font-medium pb-2 border-b"></div>
        <div class="max-h-60 overflow-y-auto">
          <ul id="busPassengerList" class="divide-y divide-gray-100 text-xs">
