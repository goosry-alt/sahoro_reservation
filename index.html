<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>사호로리조트 예약현황 관리 시스템</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css" rel="stylesheet">
  <style>
    :root {
      --primary-color: #1e3a8a;
      --secondary-color: #3b82f6;
      --bg-color: #f8fafc;
    }
    body {
      background-color: var(--bg-color);
      font-family: 'Pretendard', -apple-system, BlinkMacSystemFont, system-ui, Roboto, sans-serif;
    }
    .navbar {
      background: linear-gradient(135deg, #1e3a8a 0%, #2563eb 100%);
    }
    .card {
      border: none;
      border-radius: 12px;
      box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1);
    }
    .table-responsive {
      border-radius: 8px;
      overflow-x: auto;
    }
    .table th {
      background-color: #f1f5f9;
      color: #334155;
      font-weight: 600;
      white-space: nowrap;
      vertical-align: middle;
    }
    .table td {
      vertical-align: middle;
      white-space: nowrap;
    }
    .date-badge {
      font-size: 0.82rem;
      padding: 3px 6px;
      border-radius: 4px;
      background-color: #e2e8f0;
      color: #1e293b;
    }
    .clickable-memo {
      cursor: pointer;
      max-width: 180px;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
      color: #2563eb;
    }
    .clickable-memo:hover {
      text-decoration: underline;
    }
    .status-cancelled {
      text-decoration: line-through;
      color: #94a3b8;
      background-color: #f8fafc;
    }
    .companion-header {
      font-size: 0.85rem;
      font-weight: 700;
      color: #475569;
      background-color: #e2e8f0;
      padding: 8px 12px;
      border-radius: 6px;
      margin-bottom: 8px;
    }
    .companion-row {
      background-color: #ffffff;
      border-radius: 6px;
      padding: 8px 12px;
      margin-bottom: 6px;
      border: 1px solid #cbd5e1;
    }
    .sync-badge {
      font-size: 0.85rem;
      padding: 4px 10px;
      border-radius: 20px;
    }
  </style>
</head>
<body>

<nav class="navbar navbar-expand-lg navbar-dark mb-3">
  <div class="container-fluid px-4">
    <a class="navbar-brand fw-bold" href="#"><i class="bi bi-building"></i> 사호로리조트 예약현황 관리</a>
    <div class="d-flex gap-2">
      <button class="btn btn-light btn-sm fw-bold" onclick="openAddModal()"><i class="bi bi-plus-lg"></i> 신규 예약 추가</button>
      <button class="btn btn-outline-light btn-sm" onclick="exportJSON()"><i class="bi bi-download"></i> 백업 다운로드</button>
      <button class="btn btn-outline-light btn-sm" onclick="loadData()"><i class="bi bi-arrow-clockwise"></i> 새로고침</button>
    </div>
  </div>
</nav>

<div class="container-fluid px-4">
  <!-- 구글 시트 API 연동 설정 바 -->
  <div class="card p-3 mb-4 bg-white border">
    <div class="row g-2 align-items-center">
      <div class="col-md-2">
        <span class="fw-bold text-secondary"><i class="bi bi-file-earmark-spreadsheet-fill text-success"></i> 구글 시트 연동:</span>
      </div>
      <div class="col-md-7">
        <input type="text" id="scriptUrlInput" class="form-control form-control-sm" placeholder="https://script.google.com/macros/s/.../exec 형태의 배포 URL 입력">
      </div>
      <div class="col-md-3 d-flex gap-2">
        <button class="btn btn-primary btn-sm fw-bold px-3" onclick="saveScriptUrl()"><i class="bi bi-check-circle"></i> 연동/저장</button>
        <button class="btn btn-outline-danger btn-sm" onclick="disconnectScriptUrl()">해제</button>
        <span id="syncStatus" class="sync-badge bg-secondary text-white align-self-center">🔴 오프라인 (로컬)</span>
      </div>
    </div>
  </div>

  <!-- 통계 요약 카드 -->
  <div class="row g-3 mb-4">
    <div class="col-md-3">
      <div class="card p-3">
        <div class="text-muted small">총 예약 건수</div>
        <div class="fs-3 fw-bold text-primary" id="stat-total">0건</div>
      </div>
    </div>
    <div class="col-md-3">
      <div class="card p-3">
        <div class="text-muted small">총 투숙 인원 (PAX)</div>
        <div class="fs-3 fw-bold text-success" id="stat-pax">0명</div>
      </div>
    </div>
    <div class="col-md-3">
      <div class="card p-3">
        <div class="text-muted small">어린이 수</div>
        <div class="fs-3 fw-bold text-warning" id="stat-child">0명</div>
      </div>
    </div>
    <div class="col-md-3">
      <div class="card p-3">
        <div class="text-muted small">총 객실 수 (Rooms)</div>
        <div class="fs-3 fw-bold text-info" id="stat-rooms">0실</div>
      </div>
    </div>
  </div>

  <!-- 검색 및 상태 필터 -->
  <div class="card p-3 mb-4">
    <div class="row g-2 align-items-center">
      <div class="col-md-5">
        <div class="input-group">
          <span class="input-group-text"><i class="bi bi-search"></i></span>
          <input type="text" id="searchInput" class="form-control" placeholder="예약자명, 버스, 항공편, 메모, 방배정 검색..." oninput="renderTable()">
        </div>
      </div>
      <div class="col-md-3">
        <select id="statusFilter" class="form-select" onchange="renderTable()">
          <option value="ALL">전체 보기 (확정 + 취소)</option>
          <option value="ACTIVE" selected>예약 확정건만 보기</option>
          <option value="CANCELLED">취소건만 보기</option>
        </select>
      </div>
    </div>
  </div>

  <!-- 메인 리스트 테이블 -->
  <div class="card p-3">
    <div class="table-responsive">
      <table class="table table-hover align-middle">
        <thead>
          <tr>
            <th>상태</th>
            <th>Check In (요일)</th>
            <th>Check Out (요일)</th>
            <th>박수</th>
            <th>예약자명</th>
            <th>인원(PAX)</th>
            <th>객실</th>
            <th>LIFT</th>
            <th>Bus In</th>
            <th>Flight In</th>
            <th>Bus Out</th>
            <th>Flight Out</th>
            <th>방배정</th>
            <th>비고</th>
            <th class="text-center">상세보기</th>
            <th class="text-center">관리</th>
          </tr>
        </thead>
        <tbody id="reservationTableBody">
          <!-- JS 동적 생성 -->
        </tbody>
      </table>
    </div>
  </div>
</div>

<!-- 예약 정보 추가/수정 모달 -->
<div class="modal fade" id="reservationModal" tabindex="-1">
  <div class="modal-dialog modal-xl">
    <div class="modal-content">
      <div class="modal-header bg-primary text-white">
        <h5 class="modal-title" id="modalTitle">예약 정보 수정</h5>
        <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal"></button>
      </div>
      <div class="modal-body">
        <form id="reservationForm">
          <input type="hidden" id="editIndex">
          
          <div class="row g-3 mb-3">
            <div class="col-md-3">
              <label class="form-label fw-bold">Check In 날짜</label>
              <input type="date" id="inputCheckIn" class="form-control" onchange="updateCalculatedDates()" required>
              <span id="checkInWeekday" class="date-badge mt-1 d-inline-block">요일: -</span>
            </div>
            <div class="col-md-3">
              <label class="form-label fw-bold">Check Out 날짜</label>
              <input type="date" id="inputCheckOut" class="form-control" onchange="updateCalculatedDates()" required>
              <span id="checkOutWeekday" class="date-badge mt-1 d-inline-block">요일: -</span>
            </div>
            <div class="col-md-2">
              <label class="form-label fw-bold">숙박일수 (박)</label>
              <input type="number" id="inputNights" class="form-control" readonly>
            </div>
            <div class="col-md-4">
              <label class="form-label fw-bold">대표 예약자명</label>
              <input type="text" id="inputName" class="form-control" placeholder="성/이름 (예: KIM/JA HO)" required>
            </div>
          </div>

          <div class="row g-3 mb-3">
            <div class="col-md-2">
              <label class="form-label fw-bold">인원 (PAX)</label>
              <input type="number" id="inputPax" class="form-control" min="1" required>
            </div>
            <div class="col-md-2">
              <label class="form-label fw-bold">객실 수 (Room)</label>
              <input type="number" id="inputRoom" class="form-control" min="1" required>
            </div>
            <div class="col-md-2">
              <label class="form-label fw-bold">LIFT 권</label>
              <input type="text" id="inputLift" class="form-control" placeholder="예: 11">
            </div>
            <div class="col-md-6">
              <label class="form-label fw-bold">상세 방배정 정보</label>
              <input type="text" id="inputRoomAllocation" class="form-control" placeholder="예: Room 101(Twin), Room 102(Single)">
            </div>
          </div>

          <!-- 버스 / 항공편 드롭다운 선택 -->
          <div class="row g-3 mb-3">
            <div class="col-md-3">
              <label class="form-label fw-bold">Bus In</label>
              <select id="selectBusIn" class="form-select">
                <option value="">선택 안함</option>
                <option value="サホロEXP SAH03">サホロEXP SAH03</option>
                <option value="サホロEXP SAH07">サホロEXP SAH07</option>
                <option value="OBIHIRO">OBIHIRO</option>
              </select>
            </div>
            <div class="col-md-3">
              <label class="form-label fw-bold">Flight In</label>
              <select id="selectFlightIn" class="form-select">
                <option value="">선택 안함</option>
                <option value="OZ174">OZ174</option>
                <option value="KE765">KE765</option>
                <option value="KE769">KE769</option>
                <option value="TW263">TW263</option>
                <option value="LJ203">LJ203</option>
                <option value="LJ207">LJ207</option>
                <option value="7C1501">7C1501</option>
                <option value="7C1503">7C1503</option>
                <option value="ZE625">ZE625</option>
                <option value="ZE623">ZE623</option>
                <option value="ZE621">ZE621</option>
                <option value="ZE627">ZE627</option>
                <option value="WE531">WE531</option>
                <option value="YP751">YP751</option>
                <option value="BX523">BX523</option>
                <option value="TW269">TW269</option>
                <option value="LJ527">LJ527</option>
                <option value="ZE951">ZE951</option>
                <option value="7C1551">7C1551</option>
                <option value="RF352">RF352</option>
                <option value="RF356">RF356</option>
                <option value="RF354">RF354</option>
              </select>
            </div>
            <div class="col-md-3">
              <label class="form-label fw-bold">Bus Out</label>
              <select id="selectBusOut" class="form-select">
                <option value="">선택 안함</option>
                <option value="サホロEXP SAH06">サホロEXP SAH06</option>
                <option value="サホロEXP SAH10">サホロEXP SAH10</option>
                <option value="OBIHIRO">OBIHIRO</option>
              </select>
            </div>
            <div class="col-md-3">
              <label class="form-label fw-bold">Flight Out</label>
              <select id="selectFlightOut" class="form-select">
                <option value="">선택 안함</option>
                <option value="OZ173">OZ173</option>
                <option value="KE766">KE766</option>
                <option value="KE770">KE770</option>
                <option value="TW264">TW264</option>
                <option value="LJ204">LJ204</option>
                <option value="LJ208">LJ208</option>
                <option value="7C1502">7C1502</option>
                <option value="7C1054">7C1054</option>
                <option value="ZE626">ZE626</option>
                <option value="ZE624">ZE624</option>
                <option value="ZE622">ZE622</option>
                <option value="ZE628">ZE628</option>
                <option value="WE532">WE532</option>
                <option value="YP752">YP752</option>
                <option value="BX524">BX524</option>
                <option value="TW270">TW270</option>
                <option value="LJ528">LJ528</option>
                <option value="ZE952">ZE952</option>
                <option value="7C1552">7C1552</option>
                <option value="RF351">RF351</option>
                <option value="RF355">RF355</option>
                <option value="RF353">RF353</option>
              </select>
            </div>
          </div>

          <!-- 동행인원 정보 관리 (순서: 이름 / 생년월일 / 여권번호 / 유효기간) -->
          <div class="card p-3 mb-3 bg-light">
            <div class="d-flex justify-content-between align-items-center mb-2">
              <h6 class="fw-bold m-0"><i class="bi bi-people-fill"></i> 동행인원 상세정보 및 여권정보</h6>
              <button type="button" class="btn btn-sm btn-outline-primary" onclick="addCompanionRow()"><i class="bi bi-person-plus"></i> 동행인원 추가</button>
            </div>

            <!-- 상단 카테고리 헤더 -->
            <div class="companion-header d-none d-md-block">
              <div class="row text-center">
                <div class="col-md-3 text-start">이름 (성명)</div>
                <div class="col-md-3">생년월일</div>
                <div class="col-md-2">여권번호</div>
                <div class="col-md-2">유효기간</div>
                <div class="col-md-1">어린이 여부</div>
                <div class="col-md-1">삭제</div>

          <div class="mb-3">
            <label class="form-label fw-bold">비고 / 메모</label>
            <textarea id="inputMemo" class="form-control" rows="2" placeholder="기타 전달사항이나 요구사항을 작성하세요."></textarea>
          </div>
        </form>
      </div>
      <div class="modal-footer">
        <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">취소</button>
        <button type="button" class="btn btn-primary fw-bold" onclick="saveReservation()">저장하기</button>
      </div>
    </div>
  </div>
</div>

<!-- 예약 상세 보기 모달 -->
<div class="modal fade" id="detailModal" tabindex="-1">
  <div class="modal-dialog modal-lg">
    <div class="modal-content">
      <div class="modal-header bg-dark text-white">
        <h5 class="modal-title"><i class="bi bi-file-earmark-person"></i> 예약 상세 / 동행자 전원 및 방배정 정보</h5>
        <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal"></button>
      </div>
      <div class="modal-body" id="detailModalBody">
        <!-- JS 동적 생성 -->
      </div>
    </div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
<script>
  let scriptUrl = localStorage.getItem('sahoro_script_url') || '';
  let reservations = [
    {
      checkIn: "2026-12-14",
      checkOut: "2026-12-26",
      nights: 12,
      name: "KIM/JA HO",
      pax: 2,
      room: 1,
      lift: "11",
      busIn: "サホロEXP SAH07",
      flightIn: "KE765",
      busOut: "サホロEXP SAH06",
      flightOut: "KE766",
      roomAllocation: "Room 101 (Corner Twin)",
      memo: "Corner TWN 요청건",
      status: "ACTIVE",
      companions: [
        { name: "KIM/JA HO", birth: "1985-05-12", passport: "M12345678", expiry: "2030-05-11", isChild: false },
        { name: "LEE/SUN HEE", birth: "1988-08-20", passport: "M87654321", expiry: "2031-08-19", isChild: false }
      ]
    }
  ];

  const weekdays = ['일', '월', '화', '수', '목', '금', '토'];

  function formatDateOnly(dateVal) {
    if (!dateVal) return "";
    let str = dateVal.toString();
    if (str.indexOf("T") !== -1) {
      str = str.split("T")[0];
    }
    if (str.length >= 10 && str.match(/^\d{4}-\d{2}-\d{2}/)) {
      return str.substring(0, 10);
    }
    return str;
  }

  function getWeekday(dateStr) {
    const cleanDate = formatDateOnly(dateStr);
    if (!cleanDate) return '';
    const date = new Date(cleanDate);
    return isNaN(date.getTime()) ? '' : `(${weekdays[date.getDay()]})`;
  }

  function updateCalculatedDates() {
    const inDateVal = formatDateOnly(document.getElementById('inputCheckIn').value);
    const outDateVal = formatDateOnly(document.getElementById('inputCheckOut').value);

    document.getElementById('checkInWeekday').innerText = '요일: ' + (getWeekday(inDateVal) || '-');
    document.getElementById('checkOutWeekday').innerText = '요일: ' + (getWeekday(outDateVal) || '-');

    if (inDateVal && outDateVal) {
      const d1 = new Date(inDateVal);
      const d2 = new Date(outDateVal);
      const diffTime = d2 - d1;
      const diffDays = Math.ceil(diffTime / (1000 * 60 * 60 * 24));
      document.getElementById('inputNights').value = diffDays > 0 ? diffDays : 0;
    }
  }

  function renderTable() {
    const tbody = document.getElementById('reservationTableBody');
    const search = document.getElementById('searchInput').value.toLowerCase();
    const filter = document.getElementById('statusFilter').value;

    tbody.innerHTML = '';
    let totalPax = 0;
    let totalRooms = 0;
    let totalChild = 0;
    let activeCount = 0;

    reservations.forEach((item, index) => {
      if (filter !== 'ALL' && item.status !== filter) return;

      const cleanIn = formatDateOnly(item.checkIn);
      const cleanOut = formatDateOnly(item.checkOut);

      const fullSearchStr = `${item.name} ${item.busIn} ${item.flightIn} ${item.memo} ${item.roomAllocation}`.toLowerCase();
      if (search && !fullSearchStr.includes(search)) return;

      if (item.status === 'ACTIVE') {
        activeCount++;
        totalPax += parseInt(item.pax || 0);
        totalRooms += parseInt(item.room || 0);
        if (item.companions) {
          totalChild += item.companions.filter(c => c.isChild).length;
        }
      }

      const tr = document.createElement('tr');
      if (item.status === 'CANCELLED') tr.classList.add('status-cancelled');

      const childCount = item.companions ? item.companions.filter(c => c.isChild).length : 0;
      const childBadge = childCount > 0 ? `<span class="badge bg-warning text-dark me-1">👶 어린이 ${childCount}</span>` : '';

      tr.innerHTML = `
        <td>${item.status === 'ACTIVE' ? '<span class="badge bg-success">확정</span>' : '<span class="badge bg-secondary">취소</span>'}</td>
        <td>${cleanIn} <span class="date-badge">${getWeekday(cleanIn)}</span></td>
        <td>${cleanOut} <span class="date-badge">${getWeekday(cleanOut)}</span></td>
        <td class="fw-bold">${item.nights}박</td>
        <td class="fw-bold">${item.name}</td>
        <td>${item.pax}명 ${childBadge}</td>
        <td>${item.room}실</td>
        <td>${item.lift || '-'}</td>
        <td>${item.busIn || '-'}</td>
        <td>${item.flightIn || '-'}</td>
        <td>${item.busOut || '-'}</td>
        <td>${item.flightOut || '-'}</td>
        <td>${item.roomAllocation || '-'}</td>
        <td class="clickable-memo" onclick="openDetailModal(${index})">${item.memo || '상세보기'}</td>
        <td class="text-center">
          <button class="btn btn-sm btn-info text-white fw-bold" onclick="openDetailModal(${index})">
            <i class="bi bi-eye"></i> 상세보기
          </button>
        </td>
        <td class="text-center">
          <button class="btn btn-sm btn-outline-primary me-1" onclick="openEditModal(${index})">수정</button>
          <button class="btn btn-sm ${item.status === 'ACTIVE' ? 'btn-outline-warning' : 'btn-outline-success'} me-1" onclick="toggleCancel(${index})">
            ${item.status === 'ACTIVE' ? '취소' : '복구'}
          </button>
          <button class="btn btn-sm btn-outline-danger" onclick="deleteReservation(${index})">삭제</button>
        </td>
      `;
      tbody.appendChild(tr);
    });

    document.getElementById('stat-total').innerText = `${activeCount}건`;
    document.getElementById('stat-pax').innerText = `${totalPax}명`;
    document.getElementById('stat-child').innerText = `${totalChild}명`;
    document.getElementById('stat-rooms').innerText = `${totalRooms}실`;
  }

  function addCompanionRow(companion = {}) {
    const container = document.getElementById('companionContainer');
    const div = document.createElement('div');
    div.className = 'companion-row';
    div.innerHTML = `
      <div class="row g-2 align-items-center">
        <!-- 1. 이름 -->
        <div class="col-md-3">
          <input type="text" class="form-control form-control-sm comp-name" placeholder="성명" value="${companion.name || ''}">
        </div>
        <!-- 2. 생년월일 -->
        <div class="col-md-3">
          <input type="date" class="form-control form-control-sm comp-birth" value="${formatDateOnly(companion.birth)}">
        </div>
        <!-- 3. 여권번호 -->
        <div class="col-md-2">
          <input type="text" class="form-control form-control-sm comp-passport" placeholder="여권번호" value="${companion.passport || ''}">
        </div>
        <!-- 4. 유효기간 -->
        <div class="col-md-2">
          <input type="date" class="form-control form-control-sm comp-expiry" value="${formatDateOnly(companion.expiry)}">
        </div>
        <!-- 5. 어린이 여부 -->
        <div class="col-md-1 text-center">
          <div class="form-check d-inline-block">
            <input class="form-check-input comp-child" type="checkbox" ${companion.isChild ? 'checked' : ''}>
          </div>
        </div>
        <!-- 6. 삭제 버튼 -->
        <div class="col-md-1 text-end">
          <button type="button" class="btn btn-sm btn-outline-danger" onclick="this.closest('.companion-row').remove()"><i class="bi bi-trash"></i></button>
        </div>
      </div>
    `;
    container.appendChild(div);
  }

  function openAddModal() {
    document.getElementById('modalTitle').innerText = '신규 예약 등록';
    document.getElementById('editIndex').value = '-1';
    document.getElementById('reservationForm').reset();
    document.getElementById('companionContainer').innerHTML = '';
    updateCalculatedDates();
    new bootstrap.Modal(document.getElementById('reservationModal')).show();
  }

  function openEditModal(index) {
    const item = reservations[index];
    document.getElementById('modalTitle').innerText = '예약 정보 수정';
    document.getElementById('editIndex').value = index;

    document.getElementById('inputCheckIn').value = formatDateOnly(item.checkIn);
    document.getElementById('inputCheckOut').value = formatDateOnly(item.checkOut);
    document.getElementById('inputNights').value = item.nights;
    document.getElementById('inputName').value = item.name;
    document.getElementById('inputPax').value = item.pax;
    document.getElementById('inputRoom').value = item.room;
    document.getElementById('inputLift').value = item.lift || '';
    document.getElementById('inputRoomAllocation').value = item.roomAllocation || '';
    document.getElementById('selectBusIn').value = item.busIn || '';
    document.getElementById('selectFlightIn').value = item.flightIn || '';
    document.getElementById('selectBusOut').value = item.busOut || '';
    document.getElementById('selectFlightOut').value = item.flightOut || '';
    document.getElementById('inputMemo').value = item.memo || '';

    const container = document.getElementById('companionContainer');
    container.innerHTML = '';
    if (item.companions && item.companions.length > 0) {
      item.companions.forEach(comp => addCompanionRow(comp));
    }

    updateCalculatedDates();
    new bootstrap.Modal(document.getElementById('reservationModal')).show();
  }

  async function saveReservation() {
    const index = parseInt(document.getElementById('editIndex').value);
    
    const companionRows = document.querySelectorAll('.companion-row');
    const companions = [];
    companionRows.forEach(row => {
      companions.push({
        name: row.querySelector('.comp-name').value,
        birth: formatDateOnly(row.querySelector('.comp-birth').value),
        passport: row.querySelector('.comp-passport').value,
        expiry: formatDateOnly(row.querySelector('.comp-expiry').value),
        isChild: row.querySelector('.comp-child').checked
      });
    });

    const newItem = {
      checkIn: formatDateOnly(document.getElementById('inputCheckIn').value),
      checkOut: formatDateOnly(document.getElementById('inputCheckOut').value),
      nights: parseInt(document.getElementById('inputNights').value || 0),
      name: document.getElementById('inputName').value,
      pax: parseInt(document.getElementById('inputPax').value || 1),
      room: parseInt(document.getElementById('inputRoom').value || 1),
      lift: document.getElementById('inputLift').value,
      roomAllocation: document.getElementById('inputRoomAllocation').value,
      busIn: document.getElementById('selectBusIn').value,
      flightIn: document.getElementById('selectFlightIn').value,
      busOut: document.getElementById('selectBusOut').value,
      flightOut: document.getElementById('selectFlightOut').value,
      memo: document.getElementById('inputMemo').value,
      status: index >= 0 ? reservations[index].status : 'ACTIVE',
      companions: companions
    };

    if (index >= 0) {
      reservations[index] = newItem;
    } else {
      reservations.push(newItem);
    }

    bootstrap.Modal.getInstance(document.getElementById('reservationModal')).hide();
    await syncDataToSheet();
    renderTable();
  }

  async function toggleCancel(index) {
    reservations[index].status = reservations[index].status === 'ACTIVE' ? 'CANCELLED' : 'ACTIVE';
    await syncDataToSheet();
    renderTable();
  }

  async function deleteReservation(index) {
    if (confirm('정말로 이 예약을 삭제하시겠습니까?')) {
      reservations.splice(index, 1);
      await syncDataToSheet();
      renderTable();
    }
  }

  function openDetailModal(index) {
    const item = reservations[index];
    const modalBody = document.getElementById('detailModalBody');

    const cleanIn = formatDateOnly(item.checkIn);
    const cleanOut = formatDateOnly(item.checkOut);

    let compHtml = '';
    if (item.companions && item.companions.length > 0) {
      compHtml = `
        <table class="table table-sm table-bordered mt-2 align-middle">
          <thead class="table-light">
            <tr>
              <th style="width:5%;">#</th>
              <th>이름 (성명)</th>
              <th>생년월일</th>
              <th>여권번호</th>
              <th>유효기간</th>
              <th class="text-center">구분</th>
            </tr>
          </thead>
          <tbody>
            ${item.companions.map((c, i) => `
              <tr>
                <td>${i + 1}</td>
                <td class="fw-bold">${c.name || '-'}</td>
                <td>${formatDateOnly(c.birth) || '-'}</td>
                <td>${c.passport || '-'}</td>
                <td>${formatDateOnly(c.expiry) || '-'}</td>
                <td class="text-center">${c.isChild ? '<span class="badge bg-warning text-dark">어린이</span>' : '<span class="badge bg-secondary">성인</span>'}</td>
              </tr>
            `).join('')}
          </tbody>
        </table>
      `;
    } else {
      compHtml = '<div class="alert alert-light text-muted border">등록된 동행인원 정보가 없습니다.</div>';
    }

    modalBody.innerHTML = `
      <div class="card p-3 mb-3 bg-light border-0">
        <div class="row g-2">
          <div class="col-md-6">
            <p class="m-0"><strong>대표 예약자:</strong> ${item.name}</p>
            <p class="m-0"><strong>투숙 인원:</strong> ${item.pax}명 (${item.room}실)</p>
            <p class="m-0"><strong>일정:</strong> ${cleanIn} ${getWeekday(cleanIn)} ~ ${cleanOut} ${getWeekday(cleanOut)} (${item.nights}박)</p>
          </div>
          <div class="col-md-6">
            <p class="m-0"><strong>LIFT:</strong> ${item.lift || '-'}</p>
            <p class="m-0"><strong>교통 (In):</strong> ${item.busIn || '-'} / ${item.flightIn || '-'}</p>
            <p class="m-0"><strong>교통 (Out):</strong> ${item.busOut || '-'} / ${item.flightOut || '-'}</p>
          </div>
        </div>
      </div>

      <div class="mb-3">
        <h6 class="fw-bold text-primary"><i class="bi bi-door-open-fill"></i> 방배정 정보</h6>
        <div class="p-2 border rounded bg-white">
          ${item.roomAllocation ? `<strong>${item.roomAllocation}</strong>` : '<span class="text-muted">등록된 방배정 정보가 없습니다.</span>'}
        </div>
      </div>

      <div class="mb-3">
        <h6 class="fw-bold text-primary"><i class="bi bi-people-fill"></i> 동행자 전원 및 여권 정보 (총 ${item.companions ? item.companions.length : 0}명)</h6>
        ${compHtml}
      </div>

      <div>
        <h6 class="fw-bold text-primary"><i class="bi bi-chat-left-text-fill"></i> 비고 / 메모</h6>
        <div class="p-2 border rounded bg-white">
          ${item.memo ? item.memo : '<span class="text-muted">메모가 없습니다.</span>'}
        </div>
      </div>
    `;

    new bootstrap.Modal(document.getElementById('detailModal')).show();
  }

  // --- 구글 시트 API 연동 관련 스크립트 ---
  function saveScriptUrl() {
    const url = document.getElementById('scriptUrlInput').value.trim();
    if (url) {
      scriptUrl = url;
      localStorage.setItem('sahoro_script_url', url);
      loadData();
    }
  }

  function disconnectScriptUrl() {
    scriptUrl = '';
    localStorage.removeItem('sahoro_script_url');
    document.getElementById('scriptUrlInput').value = '';
    document.getElementById('syncStatus').className = 'sync-badge bg-secondary text-white';
    document.getElementById('syncStatus').innerText = '🔴 오프라인 (로컬)';
  }

  async function loadData() {
    if (!scriptUrl) {
      document.getElementById('syncStatus').className = 'sync-badge bg-secondary text-white';
      document.getElementById('syncStatus').innerText = '🔴 오프라인 (로컬)';
      renderTable();
      return;
    }

    try {
      document.getElementById('syncStatus').className = 'sync-badge bg-warning text-dark';
      document.getElementById('syncStatus').innerText = '🟡 구글시트 동기화 중...';
      
      const res = await fetch(scriptUrl);
      const data = await res.json();

      if (Array.isArray(data)) {
        reservations = data;
        document.getElementById('syncStatus').className = 'sync-badge bg-success text-white';
        document.getElementById('syncStatus').innerText = '🟢 구글시트 연동됨';
      }
    } catch (e) {
      console.error(e);
      document.getElementById('syncStatus').className = 'sync-badge bg-danger text-white';
      document.getElementById('syncStatus').innerText = '❌ 구글시트 연동 실패';
    }
    renderTable();
  }

  async function syncDataToSheet() {
    if (!scriptUrl) return;

    try {
      document.getElementById('syncStatus').className = 'sync-badge bg-warning text-dark';
      document.getElementById('syncStatus').innerText = '🟡 저장 중...';

      await fetch(scriptUrl, {
        method: 'POST',
        mode: 'no-cors',
        headers: { 'Content-Type': 'text/plain' },
        body: JSON.stringify(reservations)
      });

      document.getElementById('syncStatus').className = 'sync-badge bg-success text-white';
      document.getElementById('syncStatus').innerText = '🟢 구글시트 연동됨';
    } catch (e) {
      console.error(e);
      document.getElementById('syncStatus').className = 'sync-badge bg-danger text-white';
      document.getElementById('syncStatus').innerText = '❌ 저장 실패';
    }
  }

  function exportJSON() {
    const dataStr = "data:text/json;charset=utf-8," + encodeURIComponent(JSON.stringify(reservations, null, 2));
    const downloadAnchor = document.createElement('a');
    downloadAnchor.setAttribute("href", dataStr);
    downloadAnchor.setAttribute("download", `sahoro_reservations_${new Date().toISOString().substring(0,10)}.json`);
    document.body.appendChild(downloadAnchor);
    downloadAnchor.click();
    downloadAnchor.remove();
  }

  // 초기화 및 자동 로드
  if (scriptUrl) {
    document.getElementById('scriptUrlInput').value = scriptUrl;
  }
  loadData();
</script>
</body>
</html>
